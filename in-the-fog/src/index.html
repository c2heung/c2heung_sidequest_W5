<!-- Person shadow, above fog layers, dark silhouette -->
<svg
  class="person-shadow"
  width="25vw"
  height="50vh"
  viewBox="0 60 100 100"
  style="
    position: absolute;
    left: 0;
    bottom: 0;
    z-index: 99;
    opacity: 0.85;
    pointer-events: none;
  "
>
  <!-- Head -->
  <ellipse cx="50" cy="78" rx="18" ry="18" fill="#181a1c" />

</svg>
